name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── TypeScript compilation + unit tests ──────────────────────────────────
  typescript:
    name: TypeScript — compile + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compilation check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test -- --coverage --reporter=verbose

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage/lcov.info
          flags: unit
        continue-on-error: true   # Don't fail CI on coverage upload errors

  # ── Python tokenomics simulation ─────────────────────────────────────────
  python:
    name: Python — tokenomics simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tokenomics simulation
        run: python3 scripts/simulate_tokenomics.py

      - name: Python type check
        run: |
          pip install mypy
          mypy scripts/ --ignore-missing-imports

  # ── Secret guard ─────────────────────────────────────────────────────────
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Markdown lint ─────────────────────────────────────────────────────────
  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Lint markdown
        run: markdownlint "**/*.md" --ignore node_modules

  # ── Structure validation ──────────────────────────────────────────────────
  structure:
    name: Validate required files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        run: |
          for f in \
            SKILL.md AGENTS.md CLAUDE.md README.md \
            CONTRIBUTING.md CHANGELOG.md SECURITY.md \
            DEPLOYMENT.md Dockerfile requirements.txt \
            ecosystem-signals.md wallet-framework.md \
            skill/post-launch-monitoring.md \
            skill/protocol-economics.md \
            skill/airdrop-orchestration.md \
            skill/tokenomics-design.md \
            skill/liquidity-seeding.md \
            skill/market-making.md \
            skill/listing-strategy.md \
            skill/spl-token-setup.md \
            skill/governance-mechanics.md \
            skill/legal-compliance.md \
            skill/nft-launch.md \
            skill/wallet-tge-security.md \
            agents/tge-orchestrator.md \
            scripts/simulate_tokenomics.py \
            tests/unit/death-spiral-detector.test.ts \
            tests/unit/sell-pressure-analyzer.test.ts \
            tests/unit/merkle-distributor.test.ts \
            tests/unit/liquidity-health.test.ts \
            tests/integration/helius-api.test.ts \
            tests/e2e/claim-flow.test.ts; do
            test -f "$f" || { echo "❌ Missing: $f"; exit 1; }
          done
          echo "✅ All required files present"
